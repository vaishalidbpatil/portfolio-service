openapi: "3.1.0"

info:
  title: Trade Order Service API
  version: "1.0.0"
  description: |
    REST API for submitting, querying, and ingesting trade orders.

    **Versioning policy:** only breaking changes warrant a /v2 path.
    /v1 remains available for a minimum 6-month deprecation window after any /v2 is published.

servers:
  - url: http://localhost:8080
    description: Local Docker stack

security:
  - bearerAuth: []

paths:

  # ── Orders ────────────────────────────────────────────────────────────────

  /v1/orders:
    post:
      summary: Submit a trade order
      operationId: createOrder
      tags: [Orders]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
          description: Client-generated unique key. Same key always returns the same order.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

    get:
      summary: List orders
      operationId: listOrders
      tags: [Orders]
      parameters:
        - name: accountId
          in: query
          schema:
            type: string
        - name: symbol
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/OrderStatus"
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Paged list of orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedOrderResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/orders/{id}:
    get:
      summary: Get a single order
      operationId: getOrder
      tags: [Orders]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Order found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ── Metrics ───────────────────────────────────────────────────────────────

  /v1/metrics:
    get:
      summary: Get order and outbox metrics
      operationId: getMetrics
      tags: [Metrics]
      security: []
      responses:
        "200":
          description: Current metrics snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricsResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ── Ingestion ─────────────────────────────────────────────────────────────

  /v1/ingestion/jobs:
    post:
      summary: Start an ingestion job from a CSV or JSON file
      operationId: startIngestionJob
      tags: [Ingestion]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: CSV or JSON file (max 10 MB). See schema notes below.
      responses:
        "201":
          description: Job created and completed synchronously
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestionJob"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

    get:
      summary: List ingestion jobs
      operationId: listIngestionJobs
      tags: [Ingestion]
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: List of ingestion jobs ordered by start time descending
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IngestionJob"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/ingestion/jobs/{id}:
    get:
      summary: Get ingestion job status
      operationId: getIngestionJob
      tags: [Ingestion]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Job found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestionJob"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Health ────────────────────────────────────────────────────────────────

  /health/live:
    get:
      summary: Liveness probe
      operationId: healthLive
      tags: [Health]
      security: []
      responses:
        "200":
          description: Service is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: alive

  /health/ready:
    get:
      summary: Readiness probe
      operationId: healthReady
      tags: [Health]
      security: []
      responses:
        "200":
          description: Service is ready to accept traffic
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ready

# ── Components ───────────────────────────────────────────────────────────────

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Obtain a token via POST http://localhost:5001/connect/token
        (grant_type=client_credentials or authorization_code+PKCE).

  schemas:

    OrderSide:
      type: string
      enum: [BUY, SELL]

    OrderStatus:
      type: string
      enum: [PENDING, FILLED, REJECTED, DEAD_LETTERED]

    IngestionStatus:
      type: string
      enum: [RUNNING, COMPLETED, FAILED]

    CreateOrderRequest:
      type: object
      required: [accountId, symbol, side, quantity, price]
      properties:
        accountId:
          type: string
        symbol:
          type: string
          example: AAPL
        side:
          $ref: "#/components/schemas/OrderSide"
        quantity:
          type: integer
          minimum: 1
        price:
          type: number
          format: double
          exclusiveMinimum: 0

    OrderResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        accountId:
          type: string
        symbol:
          type: string
        side:
          type: string
          description: BUY or SELL
        quantity:
          type: integer
        price:
          type: number
          format: double
        status:
          type: string
          description: PENDING | FILLED | REJECTED | DEAD_LETTERED
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PagedOrderResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderResponse"
        page:
          type: integer
        pageSize:
          type: integer
        totalCount:
          type: integer
        totalPages:
          type: integer

    MetricsResponse:
      type: object
      properties:
        totalOrders:
          type: integer
        pending:
          type: integer
        filled:
          type: integer
        rejected:
          type: integer
        deadLettered:
          type: integer
        ordersLastHour:
          type: integer
        outboxPending:
          type: integer
        outboxSent:
          type: integer
        outboxFailed:
          type: integer

    IngestionJob:
      type: object
      properties:
        id:
          type: string
          format: uuid
        source:
          type: string
          description: Original file name
        sourceHash:
          type: string
          description: SHA-256 of the uploaded file content
        status:
          $ref: "#/components/schemas/IngestionStatus"
        recordsRead:
          type: integer
        recordsLoaded:
          type: integer
          description: New records inserted (duplicates excluded)
        recordsRejected:
          type: integer
          description: Records that failed validation or data-quality checks
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
          nullable: true

    ErrorResponse:
      type: object
      properties:
        error:
          type: string

  responses:

    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Unauthorized:
      description: Missing or invalid Bearer token

    NotFound:
      description: Resource not found

    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds until the rate limit resets
