<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Signing in…</title>
<style>
  body { background: #0d1117; color: #8b949e; font-family: -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-size: 0.875rem; }
  .error { color: #f85149; }
</style>
</head>
<body>
<div id="msg">Signing in…</div>
<script>
(async function () {
  const params   = new URLSearchParams(window.location.search);
  const code     = params.get('code');
  const state    = params.get('state');
  const error    = params.get('error');
  const verifier = sessionStorage.getItem('pkce_verifier');
  const savedState = sessionStorage.getItem('pkce_state');

  if (error) { showError('Auth error: ' + error); return; }
  if (!code)  { showError('No authorization code received.'); return; }
  if (state !== savedState) { showError('State mismatch — possible CSRF.'); return; }

  const authUrl  = window.AUTH_URL || 'http://localhost:5001';
  const clientId = 'dashboard';
  const redirectUri = window.location.origin + '/callback.html';

  try {
    const res = await fetch(authUrl + '/connect/token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({
        grant_type:    'authorization_code',
        client_id:     clientId,
        redirect_uri:  redirectUri,
        code,
        code_verifier: verifier
      })
    });

    if (!res.ok) { showError('Token exchange failed: ' + res.status); return; }

    const data = await res.json();
    sessionStorage.setItem('access_token', data.access_token);
    sessionStorage.removeItem('pkce_verifier');
    sessionStorage.removeItem('pkce_state');
    window.location.href = '/';
  } catch (e) {
    showError('Network error: ' + e.message);
  }

  function showError(msg) {
    document.getElementById('msg').innerHTML = '<span class="error">' + msg + '</span>';
  }
})();
</script>
</body>
</html>
