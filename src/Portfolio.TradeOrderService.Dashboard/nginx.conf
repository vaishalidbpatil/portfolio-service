server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Serve callback.html for the OAuth2 redirect URI
    location = /callback.html {
        try_files /callback.html =404;
    }

    # Everything else falls back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
